name: 카페 가격 하루 4회 전체 재조회 및 배포

on:
  schedule:
    # UTC 22/03/08/13 = KST 07/12/17/22.
    - cron: '0 3,8,13,22 * * *'
  workflow_dispatch:
    inputs:
      max_requests:
        description: '최대 검색 횟수 (일일 예산·간격 제한은 항상 적용)'
        required: true
        default: '600'
        type: choice
        options: ['1', '2', '4', '8', '12', '600']
      full_sweep:
        description: '전체 상품 재조회 (예약 실행은 항상 적용, API 안전 제한 유지)'
        type: boolean
        default: false
      retry_unconfirmed:
        description: '미확인 상품만 새 검색어로 재조회 (안전 제한 유지)'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - index.html
      - dm.html
      - deals.json
      - .github/workflows/update-deals.yml

permissions:
  contents: read

concurrency:
  group: cafe-price-pipeline
  cancel-in-progress: false

jobs:
  collect:
    if: github.event_name != 'push' && vars.CAFE_PRICE_SCHEDULER_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 110
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: 수집 로직 검증
        run: python -m unittest discover -s tests -v
      - name: 기존 상품 재확인
        env:
          COUPANG_ACCESS_KEY: ${{ secrets.COUPANG_ACCESS_KEY }}
          COUPANG_SECRET_KEY: ${{ secrets.COUPANG_SECRET_KEY }}
          MAX_REQUESTS: ${{ inputs.max_requests || '600' }}
          FULL_SWEEP: ${{ inputs.full_sweep || 'false' }}
          RETRY_UNCONFIRMED: ${{ inputs.retry_unconfirmed || 'false' }}
          PYTHONUNBUFFERED: '1'
        run: |
          args=(--refresh-existing --max-requests "$MAX_REQUESTS")
          if [ "$FULL_SWEEP" = 'true' ]; then args+=(--full-sweep); fi
          if [ "$RETRY_UNCONFIRMED" = 'true' ]; then args+=(--retry-unconfirmed); fi
          python scripts/fetch_cafe_deals.py "${args[@]}"
      - name: 일일 확인률과 누락 상품 분석
        if: always()
        run: python scripts/report_coverage.py >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: |
            data/coverage_report.json
            data/latest_refresh_run.json
      - name: 관측 및 호출 사용기록 저장
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for file in deals.json data/price_history.json data/refresh_state.json data/api_usage.json data/coverage_report.json data/latest_refresh_run.json; do
            if [ -f "$file" ]; then git add "$file"; fi
          done
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: 기존 상품 가격 및 재확인 상태 갱신"
          git push origin HEAD:main
      - name: 수집 결과 요약
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          data = json.loads(Path('deals.json').read_text())
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write('### 가격 재확인 결과\n\n')
              out.write('마지막 실행: ' + str(data.get('lastRunAt', '기록 없음')) + '\n\n')
              out.write('실행 통계: `' + json.dumps(data.get('refreshRun', {}), ensure_ascii=False) + '`\n\n')
              out.write('확인 현황: `' + json.dumps(data.get('freshnessStats', {}), ensure_ascii=False) + '`\n')
              report_path = Path('data/latest_refresh_run.json')
              if report_path.exists():
                  report = json.loads(report_path.read_text())
                  if report.get('githubRunId') == os.environ['GITHUB_RUN_ID']:
                      out.write('\n이번 실행 전체 조회 결과: `' + json.dumps({k: report.get(k) for k in ('mode', 'total', 'examined', 'notAttempted', 'confirmed', 'unconfirmed', 'stopReason')}, ensure_ascii=False) + '`\n')
          PY

  deploy:
    needs: collect
    if: always() && (github.event_name == 'push' || needs.collect.result == 'success' || needs.collect.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: 화면 로직 검증
        run: node tests/frontend.test.cjs
      - name: 수집 로직 배포 전 검증
        run: python -m unittest discover -s tests -v
      - uses: actions/configure-pages@v5
      - name: 공개 파일만 패키징
        run: |
          mkdir -p _site
          cp index.html dm.html deals.json _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: 업로드 파일 조회 준비 대기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, time, urllib.request
          url = f'https://api.github.com/repos/{os.environ["GITHUB_REPOSITORY"]}/actions/runs/{os.environ["GITHUB_RUN_ID"]}/artifacts?per_page=100'
          for attempt in range(6):
              request = urllib.request.Request(url, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
              try:
                  with urllib.request.urlopen(request, timeout=10) as response:
                      artifacts = json.load(response).get('artifacts', [])
                  if any(a['name'] == 'github-pages' and not a.get('expired') for a in artifacts):
                      print('Pages artifact is available')
                      break
              except Exception as exc:
                  print('Waiting for artifact metadata:', type(exc).__name__)
              time.sleep(5)
          else:
              raise SystemExit('Pages artifact metadata did not become available')
          PY
      - name: 사이트 배포
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: 배포 재시도 대기
        if: steps.deployment.outcome == 'failure'
        run: sleep 15
      - name: 사이트 배포 재시도
        if: steps.deployment.outcome == 'failure'
        id: deployment_retry
        uses: actions/deploy-pages@v4
