name: 직접 상품 조회 서버 진단
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: 표준 브라우저 설치
        run: |
          pip install playwright==1.65.2
          python -m playwright install --with-deps chromium
      - name: 공개 상품 페이지 표준 브라우저 1회 확인
        run: |
          python - <<'PY'
          import os, json
          from playwright.sync_api import sync_playwright
          url = 'https://www.coupang.com/vp/products/9595365819?itemId=29203033571&vendorItemId=96123294199'
          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page()
              try:
                  response = page.goto(url, wait_until='domcontentloaded', timeout=30000)
                  text = page.locator('body').inner_text(timeout=10000)
                  result = json.dumps({'http_status': response.status if response else None,
                    'title': page.title(), 'url': page.url, 'visible_text': text[:1800]}, ensure_ascii=False)
              except Exception as e:
                  result = type(e).__name__ + '; no retries'
              browser.close()
          print(result)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write('## 서버 직접 조회 시험\n\n' + result + '\n')
          PY
