# Optional alternative to Pickle. Do not activate both schedulers.
name: 기존 카페 상품 가격 재확인
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: update-deals
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 기존 상품 재확인
        env:
          COUPANG_ACCESS_KEY: ${{ secrets.COUPANG_ACCESS_KEY }}
          COUPANG_SECRET_KEY: ${{ secrets.COUPANG_SECRET_KEY }}
        run: python scripts/fetch_cafe_deals.py --refresh-existing --max-requests 8
      - name: 관측 및 호출 사용기록 저장
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for file in deals.json data/price_history.json data/refresh_state.json data/api_usage.json; do
            if [ -f "$file" ]; then git add "$file"; fi
          done
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: 기존 상품 가격 및 재확인 상태 갱신"
          git push
